name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        include:
          - os: windows-latest
            name: windows
            extension: .exe
          - os: ubuntu-latest
            name: linux
            extension: ''
          - os: macos-latest
            name: macos
            extension: .app
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev
        # Install X11 dependencies for PyQt5
        sudo apt-get install -y \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-render0 \
          libxcb-shape0 \
          libxcb-shm0 \
          libxcb-sync1 \
          libxcb-xfixes0 \
          libxcb-xinerama0 \
          libxcb-xkb1 \
          libxcb1 \
          libxkbcommon-x11-0 \
          libxkbcommon0
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build with PyInstaller
      run: pyinstaller flexlux.spec
    
    - name: List dist contents
      shell: bash
      run: |
        echo "Contents of dist directory:"
        ls -la dist/
    
    - name: Prepare release files
      shell: bash
      run: |
        cd dist
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          echo "Windows build - renaming exe"
          mv flexlux.exe flexlux-${{ matrix.name }}.exe
        elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          echo "Linux build - renaming binary"
          mv flexlux flexlux-${{ matrix.name }}
          chmod +x flexlux-${{ matrix.name }}
        elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          echo "macOS build - creating zip from .app bundle"
          if [ -d flexlux.app ]; then
            echo "Found .app bundle"
            zip -r flexlux-${{ matrix.name }}.zip flexlux.app
            rm -rf flexlux.app
          else
            echo "ERROR: No flexlux.app bundle found!"
            echo "Contents of dist:"
            ls -la
            exit 1
          fi
        fi
        echo "Final dist contents:"
        ls -la
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: flexlux-${{ matrix.name }}
        path: dist/flexlux-${{ matrix.name }}*

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: List artifacts
      run: |
        echo "Downloaded artifacts:"
        ls -R artifacts/
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        prerelease: false
        name: FlexLux ${{ github.ref_name }}
        # What's-new content is auto-generated from the commits since the
        # previous tag; the body below is static download/requirements
        # boilerplate that the generated notes are appended to.
        generate_release_notes: true
        body: |
          Cross-platform brightness control application with system tray interface.
          
          ### Downloads
          - **Windows**: Download `flexlux-windows.exe`
          - **Linux**: Download `flexlux-linux` (make executable with `chmod +x`)
          - **macOS**: Download and extract `flexlux-macos.zip`
          
          ### Requirements
          - Windows: Windows 10 or later
          - Linux: X11 display server
          - macOS: macOS 10.15 or later (may require security permissions)
        files: |
          artifacts/flexlux-windows/flexlux-windows.exe
          artifacts/flexlux-linux/flexlux-linux
          artifacts/flexlux-macos/flexlux-macos.zip 