name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            extension: .exe
          - os: ubuntu-latest
            name: linux
            extension: ''
          - os: macos-latest
            name: macos
            extension: .app
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build with PyInstaller
      run: pyinstaller flexlux.spec
    
    - name: Prepare release files
      shell: bash
      run: |
        cd dist
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          echo "Windows build - renaming exe"
          mv flexlux.exe flexlux-${{ matrix.name }}.exe
        elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          echo "Linux build - renaming binary"
          mv flexlux flexlux-${{ matrix.name }}
          chmod +x flexlux-${{ matrix.name }}
        elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          echo "macOS build - creating zip"
          zip -r flexlux-${{ matrix.name }}.zip flexlux.app
          rm -rf flexlux.app
        fi
        ls -la
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: flexlux-${{ matrix.name }}
        path: dist/flexlux-${{ matrix.name }}*

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: artifacts
    
    - name: List artifacts
      run: |
        echo "Downloaded artifacts:"
        ls -R artifacts/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        draft: false
        prerelease: false
        name: FlexLux ${{ github.ref_name }}
        body: |
          ## FlexLux ${{ github.ref_name }}
          
          Cross-platform brightness control application with system tray interface.
          
          ### Downloads
          - **Windows**: Download `flexlux-windows.exe`
          - **Linux**: Download `flexlux-linux` (make executable with `chmod +x`)
          - **macOS**: Download and extract `flexlux-macos.zip`
          
          ### What's New
          - Cross-platform support (Windows, Linux, macOS)
          - Improved error handling
          - Platform-specific optimizations
          - Enhanced documentation
          
          ### Requirements
          - Windows: Windows 10 or later
          - Linux: X11 display server
          - macOS: macOS 10.15 or later (may require security permissions)
        files: |
          artifacts/flexlux-windows/flexlux-windows.exe
          artifacts/flexlux-linux/flexlux-linux
          artifacts/flexlux-macos/flexlux-macos.zip 